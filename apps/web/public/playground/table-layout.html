<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="otto-case" content="table-layout">
<title>Customer Account Application</title>
</head>
<body bgcolor="#e8e8e8" style="font-family: Verdana, Arial; font-size: 12px">
<form name="frmApply" method="post" action="#" onsubmit="return false">
<table width="560" align="center" cellpadding="6" cellspacing="0" bgcolor="#ffffff" border="1" bordercolor="#999999">
  <tr><td colspan="2" bgcolor="#003366"><font color="#ffffff"><b>Customer Account Application</b></font></td></tr>
  <tr><td width="180"><b>First Name:</b></td><td><input type="text" name="txtF" size="30"></td></tr>
  <tr><td><b>Last Name:</b></td><td><input type="text" name="txtL" size="30"></td></tr>
  <tr><td><b>E-Mail:</b></td><td><input type="text" name="txtE" size="30"></td></tr>
  <tr><td><b>Phone No.:</b></td><td><input type="text" name="txtP" size="20"></td></tr>
  <tr><td><b>Address:</b></td><td><input type="text" name="txtA1" size="40"></td></tr>
  <tr><td><b>City:</b></td><td><input type="text" name="txtC" size="20"></td></tr>
  <tr><td><b>Zip/Postal:</b></td><td><input type="text" name="txtZ" size="10"></td></tr>
  <tr><td><b>Country:</b></td><td><select name="ddlCountry"><option value="0">-- Select --</option><option value="1">Canada</option><option value="2">India</option><option value="3">United Kingdom</option><option value="4">United States</option></select></td></tr>
  <tr><td colspan="2" align="center"><input type="submit" value="Submit Application"></td></tr>
</table>
</form>
<script>
  window.__ottoCase = {
    id: "table-layout",
    read() {
      const f = document.forms.frmApply;
      const sel = f.ddlCountry;
      return { a: f.txtF.value, b: f.txtL.value, c: f.txtE.value, d: f.txtP.value, e: f.txtA1.value, f: f.txtC.value, g: f.txtZ.value,
        h: sel.value === "0" ? "" : sel.options[sel.selectedIndex].text };
    },
  };
</script>
<script src="/playground/scorer.js"></script>
</body>
</html>
