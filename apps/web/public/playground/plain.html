<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="otto-case" content="plain-html">
<title>Member registration</title>
<style>
  body { font-family: Georgia, serif; background: #f4f1ea; color: #222; margin: 0; }
  .wrap { max-width: 640px; margin: 40px auto; background: #fff; padding: 32px; border: 1px solid #ddd; }
  h1 { font-weight: normal; margin-top: 0; }
  .row { margin-bottom: 14px; }
  label { display: block; font-size: 14px; margin-bottom: 4px; }
  input[type=text], input[type=email], input[type=tel], input[type=date], select, textarea { width: 100%; padding: 8px; border: 1px solid #aaa; box-sizing: border-box; font: inherit; }
  .inline label { display: inline; margin-right: 12px; }
  button { background: #2b5797; color: #fff; border: 0; padding: 10px 20px; font: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Member registration</h1>
  <form id="f" method="post" action="#" onsubmit="return false">
    <div class="row"><label for="title">Title</label>
      <select id="title" name="title"><option value="">--</option><option>Mr</option><option>Ms</option><option>Mrs</option><option>Dr</option></select></div>
    <div class="row"><label for="first">First name *</label><input type="text" id="first" name="first_name" required></div>
    <div class="row"><label for="last">Last name *</label><input type="text" id="last" name="last_name" required></div>
    <div class="row"><label for="email">Email address *</label><input type="email" id="email" name="email" required></div>
    <div class="row"><label for="phone">Telephone</label><input type="tel" id="phone" name="phone"></div>
    <div class="row"><label for="dob">Date of birth</label><input type="date" id="dob" name="dob"></div>
    <div class="row"><label for="street">Street address</label><input type="text" id="street" name="street"></div>
    <div class="row"><label for="city">City</label><input type="text" id="city" name="city"></div>
    <div class="row"><label for="state">State</label>
      <select id="state" name="state"><option value="">Select…</option><option value="AZ">Arizona</option><option value="CA">California</option><option value="NY">New York</option><option value="TX">Texas</option><option value="WA">Washington</option></select></div>
    <div class="row"><label for="zip">ZIP code</label><input type="text" id="zip" name="zip"></div>
    <div class="row"><label for="country">Country</label>
      <select id="country" name="country"><option value="">Select…</option><option value="CA">Canada</option><option value="IN">India</option><option value="GB">United Kingdom</option><option value="US">United States</option></select></div>
    <div class="row inline">Gender:
      <label><input type="radio" name="gender" value="female"> Female</label>
      <label><input type="radio" name="gender" value="male"> Male</label>
      <label><input type="radio" name="gender" value="other"> Other</label></div>
    <div class="row"><label for="bio">A few words about yourself</label><textarea id="bio" name="bio" rows="4"></textarea></div>
    <div class="row inline"><label><input type="checkbox" id="newsletter" name="newsletter"> Send me the monthly newsletter</label></div>
    <div class="row inline"><label><input type="checkbox" id="terms" name="terms"> I accept the terms and conditions</label></div>
    <button type="submit">Register</button>
  </form>
</div>
<script>
  window.__ottoCase = {
    id: "plain-html",
    read() {
      const fd = new FormData(document.getElementById("f"));
      const v = (n) => fd.get(n) ?? "";
      return { title: v("title"), first: v("first_name"), last: v("last_name"), email: v("email"), phone: v("phone"), dob: v("dob"),
        street: v("street"), city: v("city"), state: v("state"), zip: v("zip"), country: v("country"), gender: v("gender"), bio: v("bio"),
        newsletter: !!fd.get("newsletter"), terms: !!fd.get("terms") };
    },
  };
</script>
<script src="/playground/scorer.js"></script>
</body>
</html>
